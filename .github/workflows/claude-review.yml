name: Claude review

# Runs after CI or the release plan finish on a pull request to main. The gate job makes sure every
# check on the commit is green before an API call is spent.
#
# Three jobs, split on trust. Claude reads untrusted PR content and can be prompt injected, so the
# job that runs it has no write access and shares nothing with the privileged job except one JSON
# file. The job that sets the status and posts comments starts from a fresh checkout of main.
on:
  workflow_run:
    workflows: [CI, Release]
    types: [completed]

# One review at a time per PR. A newer push cancels the older run, so an outdated run can never
# overwrite the findings state of a newer one. Runs without a PR (pushes to main) get their own group.
concurrency:
  group: claude-review-${{ github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

# Nothing by default: every job asks for exactly what it needs.
permissions: {}

defaults:
  run:
    shell: bash

env:
  REPO: ${{ github.repository }}
  SHA: ${{ github.event.workflow_run.head_sha }}
  PR: ${{ github.event.workflow_run.pull_requests[0].number }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  gate:
    name: Gate
    # Same-repo PRs only: fork PRs must never get the API key.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
      statuses: write
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - name: Wait for every other check to be green
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          not_green=$(gh api "repos/$REPO/commits/$SHA/check-runs" --paginate \
            --jq '.check_runs[]
              | select(.status != "completed"
                  or ((.conclusion // "") | IN("success", "skipped", "neutral") | not))
              | "\(.name) (\(.status)/\(.conclusion))"')
          if [ -n "$not_green" ]; then
            echo "::notice::Skipping review, checks not green yet:"$'\n'"$not_green"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # This workflow runs on main's commit, so its own check never shows on the PR. A commit status
      # on the PR head is what the ruleset can require: pending now, success or failure in report.
      - name: Mark the review as running
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api "repos/$REPO/statuses/$SHA" -f state=pending -f context=claude-review
          -f description="Review running" -f target_url="$RUN_URL"

  review:
    name: Claude review
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Read only on purpose. Claude can write files here (git show --output=...), so nothing in this
    # job may be trusted later: report starts from its own checkout and reads only review.json.
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      # Default branch: the review rules. The PR cannot change them.
      - uses: actions/checkout@v4
        with:
          path: base
          persist-credentials: false

      # The PR head, in its own folder. Full history so `git diff origin/main...HEAD` works.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.332

      # The findings of the last review of this PR, from an earlier run. Missing or unusable state
      # just means a full review from scratch, which can only report more, never less.
      - name: Fetch the previous review state
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash base/.github/scripts/fetch_review_state.sh

      - name: Build the prompt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          meta=$(gh pr view "$PR" --repo "$REPO" --json title,headRefName,baseRefName \
            --jq '"title: \(.title)\nbranch: \(.headRefName)\nbase: \(.baseRefName)"')
          {
            echo "Analyse the changes in this pull request for security issues, error handling gaps, and test coverage."
            echo
            echo "Inspect them with \`git diff origin/main...HEAD\`; read other files only when needed."
            echo "You are read-only: do not modify files or post anything. Your only output is the JSON"
            echo "that matches the schema. \`line\` is the line number in the new version of the file."
            echo "The report format section of the review instructions is replaced by that schema:"
            echo "the overview goes in \`summary\`, each finding in \`findings\`."
            echo
            echo "<pr-metadata>"
            echo "$meta"
            echo "</pr-metadata>"
            echo
            python3 -I base/.github/scripts/post_review.py context prev/review-state.json
            echo
            echo "<review-instructions>"
            cat base/.github/REVIEW.md
            echo "</review-instructions>"
          } > "$RUNNER_TEMP/prompt.md"
          # Show what Claude is given, including the previous findings. stop-commands keeps any
          # "::" text in the PR title or in a finding from being run as a workflow command.
          token=$(openssl rand -hex 16)
          echo "::group::Prompt sent to Claude"
          echo "::stop-commands::$token"
          cat "$RUNNER_TEMP/prompt.md"
          echo "::$token::"
          echo "::endgroup::"

      - name: Run Claude
        working-directory: pr
        timeout-minutes: 10
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Defense in depth: this step reads untrusted PR content and gets no GitHub token.
          GH_TOKEN: ""
          REVIEW_SCHEMA: >-
            {"type":"object","additionalProperties":false,"required":["summary","findings","resolved"],
            "properties":{"summary":{"type":"string","description":"One or two sentences on what the PR does."},
            "findings":{"type":"array","items":{"type":"object","additionalProperties":false,
            "required":["file","line","severity","status","message"],"properties":{
            "file":{"type":"string","description":"Repo-relative path."},
            "line":{"type":"integer","minimum":1,"description":"Line in the new version of the file."},
            "severity":{"type":"string","enum":["blocker","should_fix"]},
            "status":{"type":"string","enum":["new","still_open"],"description":"still_open for a previous finding that is still unaddressed."},
            "previous_id":{"type":"string","description":"Id of the previous finding this continues. Required when status is still_open."},
            "message":{"type":"string","description":"What is wrong, why it matters here, and a concrete fix."}}}},
            "resolved":{"type":"array","description":"Previous findings that are now fixed. Empty when there were none.","items":{"type":"object","additionalProperties":false,
            "required":["previous_id","reason"],"properties":{
            "previous_id":{"type":"string"},
            "reason":{"type":"string","description":"Why it counts as fixed, for example line removed."}}}}}}
        # The prompt comes from stdin and unlisted tools are denied, so nothing can wait for input.
        # tee prints the JSON to the job log and keeps a copy for the artifact.
        run: |
          claude -p \
            --output-format json \
            --json-schema "$REVIEW_SCHEMA" \
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*)" \
            < "$RUNNER_TEMP/prompt.md" | tee "$RUNNER_TEMP/review.json"

      - uses: actions/upload-artifact@v4
        with:
          name: review
          path: ${{ runner.temp }}/review.json
          if-no-files-found: error
          retention-days: 7

  report:
    name: Report
    needs: [gate, review]
    # always(): a crashed, timed out or cancelled review must still end in a status, or the PR hangs.
    if: always() && needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write
      statuses: write
    steps:
      # Fresh checkout of the default branch: the script that runs with the write token below
      # never touches anything the Claude job could have changed.
      - uses: actions/checkout@v4
        with:
          path: base
          persist-credentials: false

      - uses: actions/download-artifact@v4
        if: needs.review.result == 'success'
        with:
          name: review
          path: result

      # Fetched again here, with the trusted script from main: the verdict and the next state must
      # not depend on anything the Claude job handed over except review.json.
      - name: Fetch the previous review state
        if: needs.review.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash base/.github/scripts/fetch_review_state.sh

      # Set before posting comments, so the status reflects the review and not whether GitHub
      # accepted every inline comment. The verdict logic is unit tested in post_review.py and exits
      # non-zero on an unreadable response, which fails this step and so ends in the error status.
      - name: Set the claude-review status
        id: status
        if: needs.review.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verdict=$(python3 -I base/.github/scripts/post_review.py verdict result/review.json \
            --previous prev/review-state.json)
          state=$(head -n 1 <<< "$verdict")
          description=$(tail -n 1 <<< "$verdict")
          gh api "repos/$REPO/statuses/$SHA" -f state="$state" -f context=claude-review \
            -f description="$description" -f target_url="$RUN_URL"

      - name: Post findings as inline comments
        if: needs.review.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -I base/.github/scripts/post_review.py post result/review.json "$REPO" "$PR" "$SHA"
          --previous prev/review-state.json --state-out review-state.json

      # The findings still open after this run, for the next one. Written only after the review was
      # posted; fixed findings are not in it, so they never come back.
      - uses: actions/upload-artifact@v4
        if: needs.review.result == 'success'
        with:
          name: review-state-pr-${{ env.PR }}
          path: review-state.json
          if-no-files-found: error
          retention-days: 30

      # Skipped once the real status is set, so a comment posting failure cannot overwrite it. When a
      # newer push cancels this run, the newer run sets its own pending and final status afterwards.
      - name: Report a failed review run
        if: always() && steps.status.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api "repos/$REPO/statuses/$SHA" -f state=error -f context=claude-review
          -f description="Review job failed, see the run" -f target_url="$RUN_URL"
