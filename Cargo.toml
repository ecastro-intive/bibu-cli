[package]
name = "bibu"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Bitbucket Cloud CLI for humans and AI agents"
license = "MIT"
repository = "https://github.com/ecastro-intive/bibu-cli"
publish = false

[package.metadata.dist]
# `publish = false` keeps bibu off crates.io; this still lets `dist` build and release it.
dist = true

[lib]
name = "bibu"
path = "src/lib.rs"

[[bin]]
name = "bibu"
path = "src/main.rs"

[dependencies]
axoupdater = { version = "0.10", features = ["blocking"] }
clap = { version = "4", features = ["derive", "env"] }
comfy-table = "7"
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
rpassword = "7"
schemars = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt"] }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

[dev-dependencies]
assert_cmd = "2"
base64 = "0.22"
jsonschema = { version = "0.58.3", default-features = false }
mockito = "1"
predicates = "3"
shell-words = "1.1.1"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
